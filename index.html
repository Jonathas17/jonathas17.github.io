<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jonathas17 — Portfolio</title>
  <meta name="description" content="Portfolio of Jonathas17 — Full Stack Developer. Projects pulled from GitHub." />

  <!-- Simple reset + Google Font -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- GitHub stats badges (replace SEU_USUARIO if needed) -->
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --muted:#9aa6bd;
      --accent:#60a5fa;
      --glass: rgba(255,255,255,0.03);
      --radius:14px;
      color-scheme: dark;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,var(--bg),#071022);color:#e6eef8;min-height:100vh}
    .container{max-width:1100px;margin:36px auto;padding:28px}
    header{display:flex;gap:20px;align-items:center}
    .avatar{width:120px;height:120px;border-radius:12px;overflow:hidden;flex:0 0 120px;border:2px solid rgba(255,255,255,0.06)}
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}
    .hero{flex:1}
    h1{margin:0;font-size:1.6rem}
    p.lead{margin:6px 0 0;color:var(--muted)}

    .badges{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .badge{background:var(--glass);padding:6px 10px;border-radius:999px;font-size:13px;color:var(--muted);border:1px solid rgba(255,255,255,0.02)}

    .controls{display:flex;gap:8px;align-items:center;margin-left:auto}
    .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:8px 12px;border-radius:10px;color:var(--muted);cursor:pointer}

    main{margin-top:30px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    @media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:640px){.grid{grid-template-columns:1fr}}

    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);padding:16px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);min-height:120px;display:flex;flex-direction:column;gap:10px}
    .card h3{margin:0;font-size:1rem}
    .card p{margin:0;color:var(--muted);font-size:14px}
    .meta{display:flex;gap:10px;align-items:center;margin-top:auto}
    .lang{font-size:13px;color:var(--muted)}
    .stat{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
    a.link{color:var(--accent);text-decoration:none}

    footer{margin-top:30px;color:var(--muted);font-size:14px;text-align:center}

    /* loader */
    .loader{display:flex;gap:8px;align-items:center}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:0.3;animation:blink 1s infinite}
    .dot:nth-child(2){animation-delay:0.15s}
    .dot:nth-child(3){animation-delay:0.3s}
    @keyframes blink{0%{opacity:0.2}50%{opacity:1}100%{opacity:0.2}}

    /* search */
    .search{display:flex;gap:8px;align-items:center;margin:18px 0}
    .search input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}

    /* empty */
    .empty{padding:24px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);border:1px dashed rgba(255,255,255,0.03);color:var(--muted)}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="avatar" id="avatar">
        <!-- avatar image inserted by JS -->
        <img src="https://avatars.githubusercontent.com/Jonathas17" alt="avatar" />
      </div>
      <div class="hero">
        <h1 id="name">Jonathas17</h1>
        <p class="lead" id="bio">Full Stack Developer — Front-end, Back-end, Dashboards</p>
        <div class="badges">
          <img src="https://img.shields.io/github/followers/Jonathas17?label=Followers&style=flat" alt="followers" class="badge">
          <img src="https://img.shields.io/github/stars/Jonathas17?style=flat" alt="stars" class="badge">
          <img src="https://komarev.com/ghpvc/?username=Jonathas17&color=blue" alt="views" class="badge">
        </div>
      </div>
      <div class="controls">
        <button class="btn" id="refresh">Refresh</button>
        <button class="btn" id="toggleTheme">Toggle Theme</button>
      </div>
    </header>

    <main>
      <section class="search">
        <input type="text" id="filter" placeholder="Filter projects by name, language or description...">
        <select id="sort">
          <option value="updated">Sort: Recently updated</option>
          <option value="stars">Sort: Most stars</option>
          <option value="forks">Sort: Most forks</option>
        </select>
      </section>

      <section id="projectsContainer">
        <div class="loader" id="loader">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
          <span style="color:var(--muted);margin-left:8px">Loading projects from GitHub...</span>
        </div>
      </section>

      <footer>
        Built with ❤️ • Data fetched from GitHub API • Deploy with GitHub Pages
      </footer>
    </main>
  </div>

  <script>
    const username = 'Jonathas17'; // your GitHub username
    const projectsContainer = document.getElementById('projectsContainer');
    const loader = document.getElementById('loader');
    const nameEl = document.getElementById('name');
    const bioEl = document.getElementById('bio');
    const avatarImg = document.querySelector('#avatar img');
    const filterInput = document.getElementById('filter');
    const sortSelect = document.getElementById('sort');
    const refreshBtn = document.getElementById('refresh');

    async function fetchProfile(){
      try{
        const res = await fetch(`https://api.github.com/users/${username}`);
        if(!res.ok) throw new Error('Failed to fetch profile');
        const data = await res.json();
        nameEl.textContent = data.name || data.login;
        bioEl.textContent = data.bio || 'Full Stack Developer — Front-end, Back-end, Dashboards';
        avatarImg.src = data.avatar_url;
      }catch(err){
        console.error(err);
      }
    }

    async function fetchRepos(){
      loader.style.display = 'flex';
      // clear previous content
      const list = document.querySelector('.grid');
      if(list) list.remove();

      try{
        const res = await fetch(`https://api.github.com/users/${username}/repos?per_page=100&sort=updated`);
        if(!res.ok) throw new Error('Failed to fetch repos: ' + res.status);
        let repos = await res.json();

        // filter out forks optionally
        repos = repos.filter(r => !r.fork);

        renderProjects(repos);
      }catch(err){
        console.error(err);
        projectsContainer.innerHTML = `<div class="empty">Could not load repositories. You may have hit the GitHub API rate limit. Try again or add a <code>GITHUB_TOKEN</code> in the code for higher rate limits.</div>`;
      }finally{
        loader.style.display = 'none';
      }
    }

    function renderProjects(repos){
      if(!repos || repos.length === 0){
        projectsContainer.innerHTML = `<div class="empty">No repositories found.</div>`;
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'grid';

      // apply initial sort
      repos = sortRepos(repos, sortSelect.value);

      repos.forEach(repo => {
        const card = document.createElement('article');
        card.className = 'card';

        const title = document.createElement('h3');
        const a = document.createElement('a');
        a.href = repo.html_url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = repo.name;
        a.className = 'link';
        title.appendChild(a);

        const desc = document.createElement('p');
        desc.textContent = repo.description || '';

        const meta = document.createElement('div');
        meta.className = 'meta';

        const lang = document.createElement('div');
        lang.className = 'lang';
        lang.textContent = repo.language || '—';

        const stats = document.createElement('div');
        stats.className = 'stat';
        stats.innerHTML = `⭐ ${repo.stargazers_count} &nbsp; • &nbsp; Forks: ${repo.forks_count}`;

        meta.appendChild(lang);
        meta.appendChild(stats);

        card.appendChild(title);
        card.appendChild(desc);
        card.appendChild(meta);

        grid.appendChild(card);
      });

      projectsContainer.appendChild(grid);
    }

    function sortRepos(repos, mode){
      const copy = [...repos];
      if(mode === 'stars') copy.sort((a,b)=> b.stargazers_count - a.stargazers_count);
      else if(mode === 'forks') copy.sort((a,b)=> b.forks_count - a.forks_count);
      else copy.sort((a,b)=> new Date(b.updated_at) - new Date(a.updated_at));
      return copy;
    }

    // filter event
    filterInput.addEventListener('input', ()=>{
      const q = filterInput.value.toLowerCase().trim();
      const cards = document.querySelectorAll('.card');
      cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(q) ? 'flex' : 'none';
      });
    });

    sortSelect.addEventListener('change', async ()=>{
      // refetch and re-render with new sort
      const res = await fetch(`https://api.github.com/users/${username}/repos?per_page=100&sort=updated`);
      const repos = await res.json();
      const filtered = repos.filter(r => !r.fork);
      const grid = document.querySelector('.grid'); if(grid) grid.remove();
      renderProjects(sortRepos(filtered, sortSelect.value));
    });

    refreshBtn.addEventListener('click', ()=>{ fetchRepos(); });

    document.getElementById('toggleTheme').addEventListener('click', ()=>{
      if(document.documentElement.hasAttribute('data-light')){
        document.documentElement.removeAttribute('data-light');
        document.documentElement.style.setProperty('--bg','#0f1724');
      } else {
        document.documentElement.setAttribute('data-light','');
        document.documentElement.style.setProperty('--bg','#f7f9fc');
        document.documentElement.style.setProperty('--card','#ffffff');
        document.documentElement.style.setProperty('--muted','#4b5563');
        document.documentElement.style.setProperty('--accent','#2563eb');
      }
    });

    // initial load
    (async ()=>{
      await fetchProfile();
      await fetchRepos();
    })();
  </script>
</body>
</html>
